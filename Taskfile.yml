version: '3'

# MkDocs Development Taskfile
# Provides tasks for installing, building, and serving MkDocs documentation

vars:
  MKDOCS_CONFIG: '{{.MKDOCS_CONFIG | default "mkdocs.yml"}}'
  SITE_DIR: '{{.SITE_DIR | default "site"}}'
  DOCS_DIR: '{{.DOCS_DIR | default "docs"}}'
  PYTHON_VERSION: '{{.PYTHON_VERSION | default "3.11"}}'
  GITHUB_ORG: '{{.GITHUB_ORG | default "brunseba"}}'
  REPO_NAME: '{{.REPO_NAME}}'
  REPO_DESCRIPTION: '{{.REPO_DESCRIPTION | default "Comprehensive MkDocs template with advanced features"}}'
  SITE_NAME: '{{.SITE_NAME | default "Documentation"}}'
  SITE_AUTHOR: '{{.SITE_AUTHOR | default "Documentation Team"}}'

tasks:
  # === Installation Tasks ===
  install:
    desc: Install MkDocs and all dependencies using pipx
    cmds:
      - task: install-pipx
      - task: install-mkdocs
      - task: install-plugins
    
  install-pipx:
    desc: Install pipx if not already installed
    cmds:
      - |
        if ! command -v pipx &> /dev/null; then
          echo "Installing pipx..."
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
          echo "Please restart your shell or run: source ~/.zshrc"
        else
          echo "pipx is already installed"
        fi
    silent: true

  install-mkdocs:
    desc: Install MkDocs core using pipx
    cmds:
      - |
        echo "Installing MkDocs with pipx..."
        pipx install mkdocs
        pipx inject mkdocs mkdocs-material
        echo "MkDocs core installed successfully"
    deps: [install-pipx]

  install-plugins:
    desc: Install MkDocs plugins using pipx inject
    cmds:
      - |
        echo "Installing MkDocs plugins..."
        pipx inject mkdocs mkdocs-git-revision-date-localized-plugin
        # mkdocs-git-committers-plugin requires GitHub access - install manually if needed
        # pipx inject mkdocs mkdocs-git-committers-plugin
        pipx inject mkdocs mkdocs-mermaid2-plugin
        pipx inject mkdocs mkdocs-macros-plugin
        pipx inject mkdocs mkdocs-minify-plugin
        pipx inject mkdocs mkdocs-awesome-pages-plugin
        pipx inject mkdocs mkdocs-redirects
        pipx inject mkdocs mkdocs-include-markdown-plugin
        pipx inject mkdocs mkdocs-section-index
        pipx inject mkdocs mkdocs-exclude
        pipx inject mkdocs pillow
        pipx inject mkdocs PyYAML
        pipx inject mkdocs mike
        echo "All plugins installed successfully"
    deps: [install-mkdocs]

  install-git-plugins:
    desc: Install GitHub-dependent plugins (requires GitHub access)
    cmds:
      - |
        echo "Installing GitHub-dependent plugins..."
        echo "Note: This requires GitHub access and proper authentication"
        pipx inject mkdocs mkdocs-git-committers-plugin
        echo "GitHub plugins installed successfully"
        echo "Remember to configure your GitHub token and update mkdocs.yml"
        echo "See GITHUB_SETUP.md for detailed instructions"
    deps: [install-mkdocs]

  # === Development Tasks ===
  serve:
    desc: Serve documentation locally with live reload
    cmds:
      - mkdocs serve --config-file={{.MKDOCS_CONFIG}} --dev-addr=127.0.0.1:8000
    deps: [check-config]

  serve-all:
    desc: Serve documentation on all interfaces (accessible from network)
    cmds:
      - mkdocs serve --config-file={{.MKDOCS_CONFIG}} --dev-addr=0.0.0.0:8000
    deps: [check-config]

  build:
    desc: Build documentation site
    cmds:
      - mkdocs build --config-file={{.MKDOCS_CONFIG}} --site-dir={{.SITE_DIR}}
    deps: [check-config]

  build-strict:
    desc: Build documentation with strict mode (warnings as errors)
    cmds:
      - mkdocs build --config-file={{.MKDOCS_CONFIG}} --site-dir={{.SITE_DIR}} --strict
    deps: [check-config]

  # === Validation Tasks ===
  check-config:
    desc: Validate MkDocs configuration
    cmds:
      - |
        if [ ! -f "{{.MKDOCS_CONFIG}}" ]; then
          echo "Error: MkDocs config file '{{.MKDOCS_CONFIG}}' not found"
          echo "Available templates:"
          ls -la *.yml 2>/dev/null || echo "No .yml files found"
          exit 1
        fi
        echo "Configuration file '{{.MKDOCS_CONFIG}}' found"
    silent: true

  validate:
    desc: Validate documentation structure and links
    cmds:
      - task: check-config
      - task: build-strict
      - |
        echo "Validation completed successfully"

  # === Cleanup Tasks ===
  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.SITE_DIR}}
      - rm -rf .mkdocs_build
      - rm -rf .cache
      - echo "Cleaned build artifacts"

  clean-all:
    desc: Clean all generated files and caches
    cmds:
      - task: clean
      - rm -rf .mike
      - rm -rf .mkdocs_plugins_cache
      - rm -rf .material_cache
      - rm -rf .git-revision-date-localized-cache
      - rm -rf .mermaid-cache
      - rm -rf .macros_cache
      - rm -rf .nav_cache
      - echo "Cleaned all caches and generated files"

  # === Template Tasks ===
  init-basic:
    desc: Initialize project with basic MkDocs template
    cmds:
      - |
        if [ -f "mkdocs.yml" ]; then
          echo "Warning: mkdocs.yml already exists. Backing up to mkdocs.yml.bak"
          cp mkdocs.yml mkdocs.yml.bak
        fi
        cp mkdocs-basic-template.yml mkdocs.yml
        cp macros.py .
        cp .metadata.yaml .
        mkdir -p {{.DOCS_DIR}}
        cp -r docs/* {{.DOCS_DIR}}/ 2>/dev/null || true
        echo "Basic MkDocs project initialized"

  init-standard:
    desc: Initialize project with standard MkDocs template
    cmds:
      - |
        if [ -f "mkdocs.yml" ]; then
          echo "Warning: mkdocs.yml already exists. Backing up to mkdocs.yml.bak"
          cp mkdocs.yml mkdocs.yml.bak
        fi
        cp mkdocs-template.yml mkdocs.yml
        cp macros.py .
        cp .metadata.yaml .
        mkdir -p {{.DOCS_DIR}}
        cp -r docs/* {{.DOCS_DIR}}/ 2>/dev/null || true
        echo "Standard MkDocs project initialized"

  init-advanced:
    desc: Initialize project with advanced MkDocs template
    cmds:
      - |
        if [ -f "mkdocs.yml" ]; then
          echo "Warning: mkdocs.yml already exists. Backing up to mkdocs.yml.bak"
          cp mkdocs.yml mkdocs.yml.bak
        fi
        cp mkdocs-advanced-template.yml mkdocs.yml
        cp macros.py .
        cp .metadata.yaml .
        mkdir -p {{.DOCS_DIR}}
        cp -r docs/* {{.DOCS_DIR}}/ 2>/dev/null || true
        echo "Advanced MkDocs project initialized"

  # === GitHub Repository Management ===
  github-create-repo:
    desc: Create GitHub repository and configure it
    cmds:
      - |
        if [ -z "{{.REPO_NAME}}" ]; then
          echo "Error: REPO_NAME is required"
          echo "Usage: task github-create-repo REPO_NAME=my-repo"
          exit 1
        fi
        echo "Creating GitHub repository {{.GITHUB_ORG}}/{{.REPO_NAME}}..."
        gh repo create {{.GITHUB_ORG}}/{{.REPO_NAME}} --public --source=. --remote=origin --push --description="{{.REPO_DESCRIPTION}}"
      - task: github-setup-labels
      - task: github-create-releases
      - task: github-update-mkdocs
        vars:
          REPO_NAME: '{{.REPO_NAME}}'

  github-setup-labels:
    desc: Create conventional commit labels for issues
    cmds:
      - |
        echo "Creating conventional commit labels..."
        gh label create "feat" --description "A new feature" --color "0052cc" --force
        gh label create "fix" --description "A bug fix" --color "d73a4a" --force
        gh label create "docs" --description "Documentation only changes" --color "0075ca" --force
        gh label create "style" --description "Changes that do not affect the meaning of the code" --color "f9d0c4" --force
        gh label create "refactor" --description "A code change that neither fixes a bug nor adds a feature" --color "fbca04" --force
        gh label create "perf" --description "A code change that improves performance" --color "7057ff" --force
        gh label create "test" --description "Adding missing tests or correcting existing tests" --color "1d76db" --force
        gh label create "build" --description "Changes that affect the build system or external dependencies" --color "fef2c0" --force
        gh label create "ci" --description "Changes to CI configuration files and scripts" --color "28a745" --force
        gh label create "chore" --description "Other changes that don't modify src or test files" --color "d4c5f9" --force
        gh label create "revert" --description "Reverts a previous commit" --color "f85149" --force
        gh label create "breaking" --description "Breaking changes" --color "b60205" --force
        echo "Labels created successfully"

  github-create-releases:
    desc: Create GitHub releases for all existing tags
    cmds:
      - |
        echo "Creating GitHub releases for existing tags..."
        git tag -l | while read tag; do
          if ! gh release view "$tag" >/dev/null 2>&1; then
            commit_msg=$(git log --format="%s" "$tag" -1)
            echo "Creating release for tag: $tag"
            case "$commit_msg" in
              "feat:"*)
                gh release create "$tag" --title "$tag - New Features" --notes "## 🚀 New Features\n\n- ${commit_msg#feat: }\n\nThis release introduces new functionality."
                ;;
              "fix:"*)
                gh release create "$tag" --title "$tag - Bug Fixes" --notes "## 🐛 Bug Fixes\n\n- ${commit_msg#fix: }\n\nThis release fixes bugs and issues."
                ;;
              "docs:"*)
                gh release create "$tag" --title "$tag - Documentation" --notes "## 📚 Documentation\n\n- ${commit_msg#docs: }\n\nThis release updates documentation."
                ;;
              "chore:"*)
                gh release create "$tag" --title "$tag - Maintenance" --notes "## 🧹 Maintenance\n\n- ${commit_msg#chore: }\n\nThis is a maintenance release."
                ;;
              *)
                gh release create "$tag" --title "$tag" --notes "## 🔄 Release\n\n- $commit_msg\n\nRelease notes for $tag."
                ;;
            esac
          else
            echo "Release for tag $tag already exists"
          fi
        done
        echo "Releases created successfully"

  github-update-mkdocs:
    desc: Update MkDocs configuration with repository information
    cmds:
      - |
        if [ -z "{{.REPO_NAME}}" ]; then
          echo "Error: REPO_NAME is required"
          echo "Usage: task github-update-mkdocs REPO_NAME=my-repo"
          exit 1
        fi
        echo "Updating MkDocs configuration for {{.GITHUB_ORG}}/{{.REPO_NAME}}..."
        # Update mkdocs.yml with repository information
        sed -i.bak "s|site_name:.*|site_name: {{.SITE_NAME}}|g" {{.MKDOCS_CONFIG}}
        sed -i.bak "s|site_author:.*|site_author: {{.SITE_AUTHOR}}|g" {{.MKDOCS_CONFIG}}
        sed -i.bak "s|site_url:.*|site_url: https://{{.GITHUB_ORG}}.github.io/{{.REPO_NAME}}|g" {{.MKDOCS_CONFIG}}
        sed -i.bak "s|repo_name:.*|repo_name: {{.GITHUB_ORG}}/{{.REPO_NAME}}|g" {{.MKDOCS_CONFIG}}
        sed -i.bak "s|repo_url:.*|repo_url: https://github.com/{{.GITHUB_ORG}}/{{.REPO_NAME}}|g" {{.MKDOCS_CONFIG}}
        sed -i.bak "s|repository:.*|repository: {{.GITHUB_ORG}}/{{.REPO_NAME}}|g" {{.MKDOCS_CONFIG}}
        sed -i.bak "s|link: https://github.com/.*/.*|link: https://github.com/{{.GITHUB_ORG}}/{{.REPO_NAME}}|g" {{.MKDOCS_CONFIG}}
        rm -f {{.MKDOCS_CONFIG}}.bak
        echo "MkDocs configuration updated successfully"

  github-setup-complete:
    desc: Complete GitHub repository setup workflow
    cmds:
      - |
        if [ -z "{{.REPO_NAME}}" ]; then
          echo "Error: REPO_NAME is required"
          echo "Usage: task github-setup-complete REPO_NAME=my-repo [SITE_NAME='My Site'] [SITE_AUTHOR='Author Name']"
          exit 1
        fi
        echo "Starting complete GitHub repository setup..."
      - task: github-create-repo
        vars:
          REPO_NAME: '{{.REPO_NAME}}'
          SITE_NAME: '{{.SITE_NAME}}'
          SITE_AUTHOR: '{{.SITE_AUTHOR}}'
      - task: github-commit-and-push
        vars:
          REPO_NAME: '{{.REPO_NAME}}'
      - |
        echo "✅ GitHub repository setup complete!"
        echo "Repository: https://github.com/{{.GITHUB_ORG}}/{{.REPO_NAME}}"
        echo "Documentation: https://{{.GITHUB_ORG}}.github.io/{{.REPO_NAME}}"

  github-commit-and-push:
    desc: Commit MkDocs changes and push to repository
    cmds:
      - |
        echo "Committing and pushing changes..."
        git add {{.MKDOCS_CONFIG}}
        git commit -m "feat: configure MkDocs for {{.REPO_NAME}} repository with git tracking and PDF export" || echo "No changes to commit"
        git push
        git push --tags
        echo "Changes pushed successfully"

  github-enable-pages:
    desc: Enable GitHub Pages for the repository
    cmds:
      - |
        echo "Enabling GitHub Pages..."
        gh api repos/{{.GITHUB_ORG}}/{{.REPO_NAME}}/pages \
          --method POST \
          --field source.branch=gh-pages \
          --field source.path=/ \
          || echo "GitHub Pages may already be enabled or requires manual setup"
        echo "GitHub Pages configuration attempted"

  github-create-workflow:
    desc: Create GitHub Actions workflow for MkDocs deployment
    cmds:
      - |
        echo "Creating GitHub Actions workflow..."
        mkdir -p .github/workflows
        cat > .github/workflows/docs.yml << 'EOF'
        name: Deploy MkDocs to GitHub Pages
        
        on:
          push:
            branches: [ main, master ]
          pull_request:
            branches: [ main, master ]
        
        permissions:
          contents: read
          pages: write
          id-token: write
        
        concurrency:
          group: "pages"
          cancel-in-progress: false
        
        jobs:
          build:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
                with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}
        
              - name: Setup Python
                uses: actions/setup-python@v4
                with:
                  python-version: '3.11'
        
              - name: Install dependencies
                run: |
                  pip install -r requirements.txt
        
              - name: Build documentation
                run: |
                  mkdocs build --strict
        
              - name: Setup Pages
                uses: actions/configure-pages@v3
        
              - name: Upload artifact
                uses: actions/upload-pages-artifact@v2
                with:
                  path: ./site
        
          deploy:
            if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
            environment:
              name: github-pages
              url: ${{ steps.deployment.outputs.page_url }}
            runs-on: ubuntu-latest
            needs: build
            steps:
              - name: Deploy to GitHub Pages
                id: deployment
                uses: actions/deploy-pages@v2
        EOF
        echo "GitHub Actions workflow created at .github/workflows/docs.yml"

  # === Deployment Tasks ===
  deploy-gh-pages:
    desc: Deploy to GitHub Pages
    cmds:
      - mkdocs gh-deploy --config-file={{.MKDOCS_CONFIG}}
    deps: [validate]

  deploy-gh-pages-force:
    desc: Force deploy to GitHub Pages (use with caution)
    cmds:
      - mkdocs gh-deploy --config-file={{.MKDOCS_CONFIG}} --force
    deps: [build-strict]

  # === Utility Tasks ===
  info:
    desc: Show MkDocs and environment information
    cmds:
      - |
        echo "=== MkDocs Environment Info ==="
        echo "MkDocs version:"
        mkdocs --version
        echo ""
        echo "Python version:"
        python3 --version
        echo ""
        echo "pipx version:"
        pipx --version
        echo ""
        echo "Current directory:"
        pwd
        echo ""
        echo "Configuration file: {{.MKDOCS_CONFIG}}"
        echo "Site directory: {{.SITE_DIR}}"
        echo "Docs directory: {{.DOCS_DIR}}"
        echo ""
        echo "Available templates:"
        ls -la *template*.yml 2>/dev/null || echo "No template files found"

  list-plugins:
    desc: List installed MkDocs plugins
    cmds:
      - |
        echo "=== Installed MkDocs Plugins ==="
        pipx list | grep -A 20 "package mkdocs" || echo "MkDocs not installed with pipx"

  update:
    desc: Update MkDocs and all plugins
    cmds:
      - |
        echo "Updating MkDocs and plugins..."
        pipx upgrade mkdocs
        echo "MkDocs updated successfully"

  # === Development Helpers ===
  new-page:
    desc: Create a new documentation page
    vars:
      PAGE_NAME: '{{.CLI_ARGS | default "new-page"}}'
    cmds:
      - |
        PAGE_PATH="{{.DOCS_DIR}}/{{.PAGE_NAME}}.md"
        if [ -f "$PAGE_PATH" ]; then
          echo "Error: Page '$PAGE_PATH' already exists"
          exit 1
        fi
        mkdir -p "$(dirname "$PAGE_PATH")"
        echo "# {{.PAGE_NAME | title}}" > "$PAGE_PATH"
        echo "" >> "$PAGE_PATH"
        echo "Your content here..." >> "$PAGE_PATH"
        echo "Created new page: $PAGE_PATH"

  lint:
    desc: Run basic linting on documentation
    cmds:
      - |
        echo "=== Documentation Linting ==="
        echo "Checking for common issues..."
        # Check for broken internal links
        find {{.DOCS_DIR}} -name "*.md" -exec grep -l "](.*\.md)" {} \; | while read file; do
          echo "Checking internal links in: $file"
          # This is a basic check - you might want to use a proper link checker
        done
        echo "Linting completed"

  # === Help ===
  help:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  default:
    desc: Default task - show help
    cmds:
      - task: help
