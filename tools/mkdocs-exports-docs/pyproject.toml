[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-exports-docs"
version = "0.1.0"
description = "MkDocs documentation export and project management scripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "openpyxl>=3.1.5",
    "pillow>=11.3.0",
    "playwright>=1.54.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
]

[project.scripts]
mkdocs-exports-docs = "mkdocs_exports_docs.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mkdocs_exports_docs*"]
