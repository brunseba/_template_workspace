# Basic MkDocs Template
# Minimal configuration for simple documentation projects

site_name: Simple Project Documentation
site_description: Simple and clean documentation
site_author: Your Name
site_url: https://yourusername.github.io/simple-project

repo_name: yourusername/simple-project
repo_url: https://github.com/yourusername/simple-project
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025 Your Name

# Theme
theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy

# Plugins
plugins:
  - search

# Markdown Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - def_list
  - abbr
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

# Navigation
nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Examples: examples.md
  - Contributing: contributing.md
  - About: about.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/simple-project
